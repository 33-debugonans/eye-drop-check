<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b7fd7"><link rel="manifest" href="manifest.webmanifest"><title>안약 체크</title><style>
:root{--a:#6b7fd7;--bg:#f7f8fc;--done:#dfe3ff;--miss:#f7e4e7;--missText:#c45d6d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#202331}.app{max-width:560px;margin:auto;padding:24px 16px}h1{font-size:23px}.cal{background:#fff;border-radius:22px;padding:18px 14px;box-shadow:0 6px 25px #1e2a5a12}.head{display:flex;justify-content:space-between;align-items:center}.month{font-size:20px;font-weight:750}.nav{border:0;background:#f0f2f9;border-radius:12px;width:42px;height:42px;font-size:22px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:#8b90a3;font-size:12px;padding:14px 0 8px}.day{position:relative;aspect-ratio:1/1.15;border:2px solid transparent;border-radius:14px;background:#fafbfe;padding:5px;overflow:hidden;color:#202331}.empty{visibility:hidden}.today{border-color:var(--a)}.num{position:relative;z-index:2;font-weight:700;font-size:15px}.day.done .num{margin-top:1px}.doneCircle{position:absolute;z-index:0;width:92%;aspect-ratio:1;border-radius:50%;background:var(--done);left:50%;top:50%;transform:translate(-50%,-50%)}.mark{position:absolute;z-index:2;left:2px;right:2px;bottom:7px;text-align:center;font-size:9px;line-height:1.1;color:#5264ad;font-weight:650}.missed{background:var(--miss)}.missMark{position:absolute;z-index:2;left:0;right:0;top:50%;transform:translateY(-38%);text-align:center;font-size:25px;font-weight:800;color:var(--missText)}.hint{text-align:center;color:#8b90a3;font-size:13px;margin-top:15px}dialog{border:0;border-radius:22px;padding:0;width:min(88vw,360px);box-shadow:0 20px 70px #0004}dialog::backdrop{background:#171a2780}.modal{padding:26px 22px 20px;text-align:center}.modal h2{margin:0 0 6px}.modal p{color:#777d90}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions.three{grid-template-columns:1fr 1fr}.btn{border:0;border-radius:14px;padding:14px;font-weight:700}.no{background:#eef0f5}.yes{background:var(--a);color:#fff}.edit{background:#e9ecfb;color:#4f61b4}.timeBox{display:none;margin:15px 0 5px;text-align:left}.timeBox label{display:block;font-size:13px;color:#777d90;margin-bottom:7px}.timeBox input{width:100%;font:inherit;padding:12px;border:1px solid #dfe2ec;border-radius:12px;background:#fff}.small{font-size:11px;color:#9a9fb0;margin-top:8px}
</style></head><body><div class="app"><h1>🌙 자기 전 안약 체크</h1><div class="cal"><div class="head"><button class="nav" id="prev">‹</button><div class="month" id="month"></div><button class="nav" id="next">›</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="grid" id="grid"></div><div class="hint">날짜를 눌러 점안 여부를 기록하거나 수정하세요.</div></div></div>
<dialog id="dlg"><div class="modal"><h2 id="q">안약 넣었나요?</h2><p id="sel"></p><div class="timeBox" id="timeBox"><label for="timeInput">점안 시간을 직접 입력하세요.</label><input type="time" id="timeInput"><div class="small">과거 기록과 자동 X 표시도 나중에 수정할 수 있어요.</div></div><div class="actions" id="actions"><button class="btn no" id="no">아니요</button><button class="btn yes" id="yes">예</button></div></div></dialog>
<script>
const $=s=>document.querySelector(s),K="eybelis-check-v2",OLD="eybelis-check-v1";
let R=JSON.parse(localStorage.getItem(K)||"null");
if(!R){const old=JSON.parse(localStorage.getItem(OLD)||"{}");R={};for(const [k,v] of Object.entries(old))R[k]={status:"done",time:v};localStorage.setItem(K,JSON.stringify(R));}
let V=new Date(),C=null;V.setDate(1);const p=n=>String(n).padStart(2,"0"),key=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,same=(a,b)=>a.toDateString()==b.toDateString();
function save(){localStorage.setItem(K,JSON.stringify(R))}
// 기록 시작일(2026-10-14) 이전에 이전 버전이 자동 생성한 X 기록은 제거합니다.
for(const k of Object.keys(R)){if(k<"2026-10-14" && R[k]?.status==="missed")delete R[k];}
save();

function cutoffPassed(d){const end=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0,0,0);return Date.now()-end.getTime()>=12*60*60*1000}
function applyMissed(){const start=new Date(2026,9,14);start.setHours(0,0,0,0);let today=new Date();today.setHours(0,0,0,0);for(let d=new Date(start);d<today;d.setDate(d.getDate()+1)){let k=key(d);if(!R[k]&&cutoffPassed(d))R[k]={status:"missed"}}save()}
function timeLabel(v){if(!v)return"";if(v.includes("오전")||v.includes("오후"))return v;let [hh,mm]=v.split(":"),h=Number(hh),ap=h<12?"오전":"오후";return `${ap} ${h%12||12}:${mm}`}
function render(){applyMissed();let y=V.getFullYear(),m=V.getMonth(),g=$("#grid"),t=new Date();$("#month").textContent=`${y}년 ${m+1}월`;g.innerHTML="";for(let i=0;i<new Date(y,m,1).getDay();i++)g.insertAdjacentHTML("beforeend",'<div class="day empty"></div>');for(let n=1;n<=new Date(y,m+1,0).getDate();n++){let d=new Date(y,m,n),k=key(d),rec=R[k],b=document.createElement("button");b.className="day"+(same(d,t)?" today":"")+(rec?.status==="done"?" done":"")+(rec?.status==="missed"?" missed":"");let extra=rec?.status==="done"?`<div class="doneCircle"></div><div class="mark">${timeLabel(rec.time)}</div>`:rec?.status==="missed"?'<div class="missMark">×</div>':"";b.innerHTML=`<div class="num">${n}</div>${extra}`;b.onclick=()=>openDay(d);g.appendChild(b)}}
function openDay(d){C=new Date(d);let k=key(C),rec=R[k],today=new Date();today.setHours(0,0,0,0);let past=C<today;$("#sel").textContent=`${C.getMonth()+1}월 ${C.getDate()}일`;$("#timeBox").style.display="none";$("#actions").innerHTML="";if(past||rec){$("#q").textContent=rec?.status==="done"?"점안 기록을 수정할까요?":rec?.status==="missed"?"미복용 기록을 수정할까요?":"과거 점안 기록을 입력할까요?";$("#timeBox").style.display="block";$("#timeInput").value=to24(rec?.time)||"22:30";$("#actions").innerHTML='<button class="btn no" id="cancel">취소</button><button class="btn yes" id="saveEdit">복용 완료</button>';$("#cancel").onclick=()=>$("#dlg").close();$("#saveEdit").onclick=()=>{R[k]={status:"done",time:$("#timeInput").value};save();$("#dlg").close();render()}}else{$("#q").textContent="안약 넣었나요?";$("#actions").innerHTML='<button class="btn no" id="no2">아니요</button><button class="btn yes" id="yes2">예</button>';$("#no2").onclick=()=>$("#dlg").close();$("#yes2").onclick=()=>{let n=new Date();R[k]={status:"done",time:`${p(n.getHours())}:${p(n.getMinutes())}`};save();$("#dlg").close();render()}}$("#dlg").showModal()}
function to24(v){if(!v)return"";if(/^\d{2}:\d{2}$/.test(v))return v;let m=v.match(/(오전|오후)\s*(\d{1,2}):(\d{2})/);if(!m)return"";let h=Number(m[2]);if(m[1]==="오전"&&h===12)h=0;if(m[1]==="오후"&&h!==12)h+=12;return `${p(h)}:${m[3]}`}
$("#prev").onclick=()=>{V.setMonth(V.getMonth()-1);render()};$("#next").onclick=()=>{V.setMonth(V.getMonth()+1);render()};render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
