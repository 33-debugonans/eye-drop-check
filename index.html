<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3157d6"><link rel="manifest" href="manifest.webmanifest">
<title>자기 전 안약 체크</title>
<style>
:root{--blue:#3158e8;--ink:#171b42;--line:#e2e1ef;--lav:#e9e4ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}
body{background:#78b9ff url("background.jpg") center/cover fixed no-repeat;padding:12.3vh 0 7vh}
.app{width:min(90.5vw,782px);margin:0 auto}
.titlebar{height:70px;border:1.5px solid #4964cf;background:#496ce0;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 13px;color:#fff}
.brand{display:flex;align-items:center;gap:9px;font-size:clamp(18px,3.1vw,25px);font-weight:560;letter-spacing:-.3px}.brand img{width:48px;height:55px;object-fit:contain}.moon{font-size:1em}
.wincontrols{display:flex;gap:4px}.wincontrols span{width:42px;height:39px;display:grid;place-items:center;background:#f7e8ff;border:1px solid #b9aee7;color:#171734;font-size:25px;line-height:1}
.panel{margin:0;border:1.5px solid #a7a8df;border-radius:25px;background:rgba(253,252,255,.975);padding:21px 10px 15px;box-shadow:none}
.head{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:10px;margin:0 10px 15px}
.month{text-align:center;font-size:clamp(24px,4.3vw,34px);font-weight:680;letter-spacing:-1px}
.nav{height:55px;border:1px solid #c9c3ee;border-radius:8px;background:#eee9ff;font-size:33px;color:#15183c;box-shadow:none}
.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week div{text-align:center;font-size:14px;font-weight:540;color:#555a7e;padding:6px 0 10px}.week div:first-child{color:#ed5e7d}.week div:last-child{color:#3159e8}
.day{position:relative;min-height:128px;border:1px solid var(--line);border-radius:12px;background:rgba(252,251,255,.72);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink);padding:0;box-shadow:none}
.empty{visibility:hidden}.today{border:2px solid var(--blue);background:rgba(255,255,255,.82)}
.content{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center}
.num{font-size:17px;font-weight:560;line-height:1}.mark{font-size:12.5px;font-weight:520;color:#59639a;line-height:1;font-variant-numeric:tabular-nums}
.doneCircle{position:absolute;z-index:0;width:min(74%,76px);aspect-ratio:1;border-radius:50%;left:50%;top:52%;transform:translate(-50%,-50%);background:rgba(224,217,255,.68)}
.miniBottle{position:absolute;z-index:3;left:9px;top:9px;width:21px;height:27px;object-fit:contain}
.missed{background:rgba(255,248,250,.8)}.missMark{font-size:28px;color:#d62f4b;font-weight:700;line-height:1}
.legend{margin-top:17px;padding:12px 8px;border:1px solid #dedbed;border-radius:9px;background:rgba(249,247,255,.82);display:flex;justify-content:space-around;gap:5px;font-size:11px;font-weight:540;color:#4c5074}
.legend span{display:flex;align-items:center;gap:5px}.lg{width:27px;height:27px;border-radius:50%;display:inline-grid;place-items:center}.lgd{background:rgba(224,217,255,.78)}.lgx{background:#ffc8d2;color:#c9233d;font-size:20px}.lgt{border:1.8px solid var(--blue);background:#fff}.lgn{border:1.5px solid #d8dae6;background:#fff}
.hint{display:none}
dialog{border:1px solid #6573cf;padding:0;width:min(88vw,370px);box-shadow:none}dialog::backdrop{background:#1c275c55}.modalTitle{background:#496ce0;color:#fff;font-weight:650;padding:9px 12px}.modalBody{padding:20px;text-align:center}.modalBody h2{margin:0 0 5px}.modalBody p{color:#686e91}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:1px solid #cbc7e7;padding:12px;font-weight:650;background:#f1eff8}.yes{background:#e5e0ff}.timeBox{display:none;margin-top:13px;text-align:left}.timeBox label{display:block;font-size:12px;color:#666d90;margin-bottom:6px}.timeBox input{width:100%;padding:11px;font:inherit}.small{font-size:10px;color:#969bb1;margin-top:6px}
@media(max-width:500px){
 body{padding:12.3vh 0 5vh}.app{width:90.5vw}.titlebar{height:55px}.brand{font-size:17px}.brand img{width:37px;height:43px}.wincontrols span{width:34px;height:31px;font-size:21px}
 .panel{padding:17px 7px 12px;border-radius:21px}.head{grid-template-columns:48px 1fr 48px;margin:0 8px 12px}.nav{height:46px;font-size:28px}.month{font-size:25px}
 .week,.grid{gap:4px}.week div{font-size:11.5px}.day{min-height:96px;border-radius:10px}.num{font-size:15px}.mark{font-size:10.8px}.doneCircle{width:min(72%,62px)}.miniBottle{width:18px;height:23px;left:5px;top:6px}
 .legend{font-size:9px;padding:9px 4px}.lg{width:22px;height:22px}
}
</style></head>
<body><main class="app">
<div class="titlebar">
  <div class="brand"><img src="title-bottle.png" alt=""><span>자기 전 안약 체크</span><span class="moon">🌙</span></div>
  <div class="wincontrols"><span>−</span><span>□</span><span>×</span></div>
</div>
<section class="panel">
<div class="head"><button class="nav" id="prev">‹</button><div class="month" id="month"></div><button class="nav" id="next">›</button></div>
<div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
<div class="grid" id="grid"></div>
<div class="legend"><span><i class="lg lgd"></i>복용 완료</span><span><i class="lg lgx">×</i>미복용</span><span><i class="lg lgt"></i>오늘</span><span><i class="lg lgn"></i>기록 없음</span></div>
<div class="hint">날짜를 눌러 점안 여부를 기록하거나 수정하세요.</div>
</section></main>
<dialog id="dlg"><div class="modalTitle">안약 체크</div><div class="modalBody"><h2 id="q">안약 넣었나요?</h2><p id="sel"></p>
<div class="timeBox" id="timeBox"><label>점안 시간을 직접 입력하세요.</label><input type="time" id="timeInput"><div class="small">과거 기록과 자동 X도 나중에 수정할 수 있어요.</div></div>
<div class="actions" id="actions"></div></div></dialog>
<script>
const $=s=>document.querySelector(s),K="eybelis-check-v2",OLD="eybelis-check-v1";let R=JSON.parse(localStorage.getItem(K)||"null");
if(!R){const o=JSON.parse(localStorage.getItem(OLD)||"{}");R={};for(const[k,v]of Object.entries(o))R[k]={status:"done",time:v};localStorage.setItem(K,JSON.stringify(R))}
let V=new Date(),C=null;V.setDate(1);const p=n=>String(n).padStart(2,"0"),key=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,same=(a,b)=>a.toDateString()===b.toDateString();
function save(){localStorage.setItem(K,JSON.stringify(R))}
for(const k of Object.keys(R))if(k<"2026-10-14"&&R[k]?.status==="missed")delete R[k];save();
function cutoffPassed(d){const end=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return Date.now()-end.getTime()>=12*60*60*1000}
function applyMissed(){const start=new Date(2026,9,14),today=new Date();today.setHours(0,0,0,0);for(let d=new Date(start);d<today;d.setDate(d.getDate()+1)){const k=key(d);if(!R[k]&&cutoffPassed(d))R[k]={status:"missed"}}save()}
function to24(v){if(!v)return"";if(/^\d{1,2}:\d{2}$/.test(v)){let[h,m]=v.split(":");return`${p(Number(h))}:${m}`}const m=v.match(/(오전|오후)\s*(\d{1,2}):(\d{2})/);if(!m)return"";let h=+m[2];if(m[1]==="오전"&&h===12)h=0;if(m[1]==="오후"&&h!==12)h+=12;return`${p(h)}:${m[3]}`}
function grace(d){const n=new Date();if(n.getHours()>=5)return false;const y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1),t=new Date(d);y.setHours(0,0,0,0);t.setHours(0,0,0,0);return same(y,t)}
function render(){applyMissed();const y=V.getFullYear(),m=V.getMonth(),g=$("#grid"),now=new Date();$("#month").textContent=`${y}년 ${m+1}월`;g.innerHTML="";
for(let i=0;i<new Date(y,m,1).getDay();i++)g.insertAdjacentHTML("beforeend",'<div class="day empty"></div>');
for(let n=1;n<=new Date(y,m+1,0).getDate();n++){const d=new Date(y,m,n),k=key(d),r=R[k],b=document.createElement("button");b.className="day"+(same(d,now)?" today":"")+(r?.status==="missed"?" missed":"");
let h=`<div class="content"><div class="num">${n}</div>`;if(r?.status==="done")h+=`<div class="mark">${to24(r.time)}</div>`;else if(r?.status==="missed")h+=`<div class="missMark">×</div>`;h+="</div>";
if(r?.status==="done")h=`<div class="doneCircle"></div><img class="miniBottle" src="bottle-mini.png" alt="">`+h;b.innerHTML=h;b.onclick=()=>openDay(d);g.appendChild(b)}}
function setDone(k,t){R[k]={status:"done",time:t};save();$("#dlg").close();render()}
function openDay(d){C=new Date(d);const k=key(C),r=R[k],n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate()),t=new Date(C);t.setHours(0,0,0,0);const past=t<today,ok=grace(t);
$("#sel").textContent=`${C.getMonth()+1}월 ${C.getDate()}일`;$("#timeBox").style.display="none";$("#actions").innerHTML="";
if((!past||ok)&&!r){$("#q").textContent="안약 넣었나요?";$("#actions").innerHTML='<button class="btn" id="no">아니요</button><button class="btn yes" id="yes">예</button>';$("#no").onclick=()=>$("#dlg").close();$("#yes").onclick=()=>{const x=new Date();setDone(k,`${p(x.getHours())}:${p(x.getMinutes())}`)}}
else{$("#q").textContent=r?.status==="done"?"점안 기록을 수정할까요?":r?.status==="missed"?"미복용 기록을 수정할까요?":"과거 점안 기록을 입력할까요?";$("#timeBox").style.display="block";$("#timeInput").value=to24(r?.time)||"22:30";$("#actions").innerHTML='<button class="btn" id="cancel">취소</button><button class="btn yes" id="edit">복용 완료</button>';$("#cancel").onclick=()=>$("#dlg").close();$("#edit").onclick=()=>setDone(k,$("#timeInput").value)}
$("#dlg").showModal()}
$("#prev").onclick=()=>{V.setMonth(V.getMonth()-1);render()};$("#next").onclick=()=>{V.setMonth(V.getMonth()+1);render()};render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update());
</script></body></html>
