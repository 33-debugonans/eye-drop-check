<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b79e7">
<link rel="manifest" href="manifest.webmanifest">
<title>자기 전 안약 체크</title>
<style>
:root{
  --ink:#171b43;
  --muted:#59628f;
  --blue:#3159e8;
  --line:rgba(209,210,230,.48);
  --lav:rgba(226,220,255,.62);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  color:var(--ink);
  background-color:#8cc3f7;
  background-image:url("background-target.jpg?v=22");
  background-position:center top;
  background-size:100% 100%;
  background-repeat:no-repeat;
}

/* 시안 비율: 화면 아래에 꽃밭이 충분히 남도록 달력을 짧게 고정 */
.app{
  position:relative;
  width:90.2vw;
  max-width:780px;
  height:77.2svh;
  margin:12.4svh auto 0;
}
.titlebar{
  width:100%;
  height:4.55svh;
  min-height:44px;
  max-height:68px;
}
.titlebar img{
  display:block;width:100%;height:100%;object-fit:fill;
}
.calendar{
  height:72.65svh;
  min-height:0;
  background:rgba(253,252,255,.985);
  border:1px solid rgba(120,126,194,.74);
  border-top:0;
  border-radius:0 0 18px 18px;
  padding:1.55svh 1.45% .85svh;
  display:flex;
  flex-direction:column;
  box-shadow:none;
}
.month-row{
  height:4.15svh;
  flex:0 0 auto;
  display:grid;
  grid-template-columns:7.4% 1fr 7.4%;
  align-items:center;
  gap:4%;
  margin:0 6.2% .35svh;
}
.month{
  text-align:center;
  font-size:clamp(20px,3.4vw,29px);
  font-weight:650;
  letter-spacing:-1.1px;
  line-height:1;
}
.arrow{
  width:100%;
  aspect-ratio:1;
  padding:0;
  border:1px solid #c8c2e9;
  border-radius:8px;
  background:#eeeaff;
  color:#171b43;
  box-shadow:none;
  font-size:clamp(20px,3.2vw,28px);
  line-height:1;
}
.week{
  flex:0 0 2.55svh;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:.55%;
  align-items:center;
}
.week span{
  text-align:center;
  font-size:clamp(9px,1.45vw,12px);
  font-weight:520;
  color:#555a7e;
}
.week span:first-child{color:#ef5d7d}
.week span:last-child{color:#3159e8}

.days{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  grid-template-rows:repeat(5,minmax(0,1fr));
  gap:.62%;
}
.day{
  position:relative;
  min-width:0;min-height:0;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(251,250,254,.35);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  box-shadow:none;
}
.day.blank{visibility:hidden}
.day.today{
  border:1.8px solid var(--blue);
  background:rgba(255,255,255,.68);
}
.day-core{
  position:relative;
  z-index:2;
  width:100%;height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:.32svh;
}
.date-num{
  font-size:clamp(11px,1.62vw,14px);
  font-weight:570;
  line-height:1;
}
.time{
  font-size:clamp(9px,1.32vw,11px);
  color:#59639a;
  font-weight:540;
  line-height:1;
  font-variant-numeric:tabular-nums;
}

/* 시안의 핵심: 원과 병을 별도 요소로 띄우지 않고 한 배지로 묶음 */
.done-badge{
  position:absolute;
  z-index:1;
  left:50%;
  top:54%;
  width:70.4%;
  max-width:70px;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:var(--lav);
}
.done-badge img{
  position:absolute;
  width:42%;
  height:auto;
  left:-6%;
  top:-19%;
  object-fit:contain;
  transform:rotate(2deg);
  image-rendering:auto;
}
.day.done .day-core{padding-top:.6svh}
.day.missed .date-num{margin-bottom:2px}
.miss-x{
  font-size:clamp(18px,2.5vw,23px);
  color:#d72c49;
  font-weight:700;
  line-height:1;
}

.legend{
  flex:0 0 4.0svh;
  margin-top:.72svh;
  border:1px solid rgba(215,212,235,.68);
  border-radius:8px;
  background:rgba(247,245,255,.74);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 1.2%;
  color:#4d5277;
  font-size:clamp(8px,1.15vw,10px);
  font-weight:540;
}
.legend-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
.key{width:clamp(19px,2.8vw,25px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.key.done{background:rgba(226,220,255,.82)}
.key.miss{background:#ffc8d2;color:#cc2942;font-size:17px;font-weight:700}
.key.today{background:#fff;border:1.7px solid var(--blue)}
.key.none{background:#fff;border:1.3px solid #d8dae6}

/* 팝업 — 기능은 dialog overlay 그대로, 외형은 시안 기준 */
dialog{
  width:min(72vw,560px);
  padding:0;
  border:1.25px solid #6677d1;
  border-radius:15px;
  overflow:visible;
  background:#fbfaff;
  box-shadow:0 5px 0 rgba(56,67,137,.13);
}
dialog::backdrop{background:rgba(30,42,88,.40)}
.popup-head{
  height:4.5svh;
  min-height:46px;
  position:relative;
  display:flex;
  align-items:center;
  padding:0 52px 0 66px;
  background:linear-gradient(90deg,#3f70e9 0%,#6683e9 100%);
  border-radius:14px 14px 0 0;
  color:#fff;
  font-size:clamp(13px,1.75vw,16px);
  font-weight:620;
}
.popup-bottle{
  position:absolute;
  left:14px;top:50%;
  width:52px;height:auto;
  transform:translate(-8px,-56%) rotate(-5deg);
  object-fit:contain;
  object-position:center;
  border-radius:0;
  z-index:3;
  pointer-events:none;
}
.popup-close{
  position:absolute;
  right:12px;top:50%;
  transform:translateY(-50%);
  width:34px;height:34px;
  border:1px solid #a79cd6;
  border-radius:5px;
  background:#faeaff;
  color:#17183c;
  display:grid;place-items:center;
  font-size:23px;
  font-weight:400;
  line-height:1;
  cursor:pointer;
}
.popup-body{
  padding:2.2svh 5.2% 2.0svh;
  text-align:center;
  background:linear-gradient(180deg,#fff 0%,#fbfaff 100%);
  border-radius:0 0 14px 14px;
}
.popup-body h2{
  margin:0 0 .85svh;
  color:#15173c;
  font-size:clamp(20px,3.0vw,27px);
  font-weight:700;
  letter-spacing:-1.4px;
}
.popup-date{
  color:#777c9b;
  font-size:clamp(12px,1.75vw,15px);
}
.popup-actions{
  margin-top:1.8svh;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2.1%;
}
.popup-btn{
  height:5.0svh;
  min-height:48px;
  border:1px solid #cbc7e7;
  border-radius:11px;
  background:#f7f6fb;
  color:#17172f;
  font-size:clamp(13px,1.8vw,16px);
  font-weight:680;
  box-shadow:none;
}
.popup-btn.yes{background:#e9e4ff}
.time-editor{display:none;margin-top:15px;text-align:left}
.time-editor input{
  width:100%;padding:10px;border:1px solid #cbc7e7;border-radius:8px;font:inherit
}
</style>
</head>
<body>
<main class="app">
  <div class="titlebar"><img src="titlebar.jpg?v=22" alt="자기 전 안약 체크"></div>
  <section class="calendar">
    <div class="month-row">
      <button class="arrow" id="prev" aria-label="이전 달">‹</button>
      <div class="month" id="month"></div>
      <button class="arrow" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="days" id="grid"></div>
    <div class="legend">
      <span class="legend-item"><i class="key done"></i>복용 완료</span>
      <span class="legend-item"><i class="key miss">×</i>미복용</span>
      <span class="legend-item"><i class="key today"></i>오늘</span>
      <span class="legend-item"><i class="key none"></i>기록 없음</span>
    </div>
  </section>
</main>

<dialog id="dlg">
  <div class="popup-head">
    <img class="popup-bottle" src="popup-bottle.png?v=26" alt="">
    <span>안약 체크</span>
    <button class="popup-close" id="closeDlg" aria-label="닫기">×</button>
  </div>
  <div class="popup-body">
    <h2>안약 넣었나요?</h2>
    <div class="popup-date" id="sel"></div>
    <div class="time-editor" id="timeEditor"><input type="time" id="timeInput"></div>
    <div class="popup-actions" id="actions"></div>
  </div>
</dialog>

<script>
const KEY="eybelis-check-v1";
const MIGRATION_KEY="eybelis-v18-restored-known-records";
const AUTO_X_START="2026-10-14";
let data={};
try{ data=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ data={}; }

// v17에서 기존 완료 기록이 X로 덮인 문제를 1회 복구.
// 이전 화면에서 실제 확인된 기록만 복구하며, 이후 사용자가 수정한 값은 다시 건드리지 않는다.
if(!localStorage.getItem(MIGRATION_KEY)){
  const known={
    "2026-10-14":"02:17",
    "2026-10-15":"00:49",
    "2026-10-16":"00:30",
    "2026-10-17":"03:00",
    "2026-10-18":"12:30",
    "2026-10-19":"23:43",
    "2026-10-20":"22:27"
  };
  for(const [k,time] of Object.entries(known)) data[k]={status:"yes",time};
  localStorage.setItem(KEY,JSON.stringify(data));
  localStorage.setItem(MIGRATION_KEY,"1");
}

const now=new Date();
let viewY=now.getFullYear(), viewM=now.getMonth();
let selectedKey=null;

const monthEl=document.getElementById("month");
const grid=document.getElementById("grid");
const dlg=document.getElementById("dlg");
const sel=document.getElementById("sel");
const actions=document.getElementById("actions");
const timeEditor=document.getElementById("timeEditor");
const timeInput=document.getElementById("timeInput");

function pad(n){return String(n).padStart(2,"0")}
function keyOf(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`}
function todayKey(){let d=new Date();return keyOf(d.getFullYear(),d.getMonth(),d.getDate())}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function formatTime(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function displayDate(k){let [y,m,d]=k.split("-").map(Number);return `${m}월 ${d}일`}

function maybeAutoX(){
  // "12시간 미체크" = 하루가 끝난 뒤 다음 날 정오가 지나도 기록이 없을 때만 X.
  // 오늘 날짜를 당일 정오에 X 처리하던 v17 오류를 수정했다.
  const t=new Date();
  const cutoff=new Date(t.getFullYear(),t.getMonth(),t.getDate()-1);
  if(t.getHours()<12) cutoff.setDate(cutoff.getDate()-1);
  let cursor=new Date(2026,9,14);
  while(cursor<=cutoff){
    const k=keyOf(cursor.getFullYear(),cursor.getMonth(),cursor.getDate());
    if(!data[k]) data[k]={status:"no"};
    cursor.setDate(cursor.getDate()+1);
  }
  save();
}

function render(){
  maybeAutoX();
  monthEl.textContent=`${viewY}년 ${viewM+1}월`;
  grid.innerHTML="";
  const first=new Date(viewY,viewM,1).getDay();
  const count=new Date(viewY,viewM+1,0).getDate();

  for(let i=0;i<first;i++){
    const b=document.createElement("div"); b.className="day blank"; grid.appendChild(b);
  }
  for(let d=1;d<=count;d++){
    const k=keyOf(viewY,viewM,d);
    const rec=data[k];
    const cell=document.createElement("button");
    cell.className="day";
    if(k===todayKey()) cell.classList.add("today");

    const core=document.createElement("div"); core.className="day-core";
    const num=document.createElement("div"); num.className="date-num"; num.textContent=d;

    if(rec && rec.status==="yes"){
      cell.classList.add("done");
      const badge=document.createElement("div"); badge.className="done-badge";
      const img=document.createElement("img"); img.src="bottle-mini.png?v=26"; img.alt="";
      badge.appendChild(img); cell.appendChild(badge);
      core.appendChild(num);
      const tm=document.createElement("div"); tm.className="time"; tm.textContent=rec.time||"";
      core.appendChild(tm);
    }else if(rec && rec.status==="no"){
      cell.classList.add("missed");
      core.appendChild(num);
      const x=document.createElement("div"); x.className="miss-x"; x.textContent="×";
      core.appendChild(x);
    }else{
      core.appendChild(num);
    }
    cell.appendChild(core);
    cell.addEventListener("click",()=>openDialog(k));
    grid.appendChild(cell);
  }
}

function openDialog(k){
  selectedKey=k;
  sel.textContent=displayDate(k);
  timeEditor.style.display="none";
  actions.innerHTML="";

  const no=document.createElement("button");
  no.className="popup-btn"; no.textContent="아니요";
  no.onclick=()=>{ data[k]={status:"no"}; save(); dlg.close(); render(); };

  const yes=document.createElement("button");
  yes.className="popup-btn yes"; yes.textContent="예";
  yes.onclick=()=>{
    const isToday=k===todayKey();
    if(isToday){
      data[k]={status:"yes",time:formatTime(new Date())};
      save(); dlg.close(); render();
    }else{
      timeInput.value=(data[k]&&data[k].time)||"22:30";
      timeEditor.style.display="block";
      yes.textContent="시간 저장";
      yes.onclick=()=>{
        data[k]={status:"yes",time:timeInput.value||"22:30"};
        save(); dlg.close(); render();
      };
    }
  };
  actions.append(no,yes);
  dlg.showModal();
}
document.getElementById("closeDlg").onclick=()=>dlg.close();
document.getElementById("prev").onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--}render()};
document.getElementById("next").onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++}render()};
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
render();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
