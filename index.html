<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b7fd7"><link rel="manifest" href="manifest.webmanifest"><title>안약 체크</title><style>
:root{--a:#6b7fd7;--bg:#f7f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#202331}.app{max-width:560px;margin:auto;padding:24px 16px}h1{font-size:23px}.cal{background:#fff;border-radius:22px;padding:18px 14px;box-shadow:0 6px 25px #1e2a5a12}.head{display:flex;justify-content:space-between;align-items:center}.month{font-size:20px;font-weight:750}.nav{border:0;background:#f0f2f9;border-radius:12px;width:42px;height:42px;font-size:22px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:#8b90a3;font-size:12px;padding:14px 0 8px}.day{position:relative;aspect-ratio:1/1.15;border:2px solid transparent;border-radius:14px;background:#fafbfe;padding:6px}.empty{visibility:hidden}.today{border-color:var(--a)}.num{font-weight:700}.mark{position:absolute;left:1px;right:1px;bottom:7px;text-align:center;font-size:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--a);margin-right:3px}.hint{text-align:center;color:#8b90a3;font-size:13px;margin-top:15px}dialog{border:0;border-radius:22px;padding:0;width:min(88vw,360px);box-shadow:0 20px 70px #0004}dialog::backdrop{background:#171a2780}.modal{padding:26px 22px 20px;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:14px;font-weight:700}.no{background:#eef0f5}.yes{background:var(--a);color:#fff}
</style></head><body><div class="app"><h1>🌙 자기 전 안약 체크</h1><div class="cal"><div class="head"><button class="nav" id="prev">‹</button><div class="month" id="month"></div><button class="nav" id="next">›</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="grid" id="grid"></div><div class="hint">오늘 날짜를 눌러 점안 여부를 기록하세요.</div></div></div>
<dialog id="dlg"><div class="modal"><h2>안약 넣었나요?</h2><p id="sel"></p><div class="actions"><button class="btn no" id="no">아니요</button><button class="btn yes" id="yes">예</button></div></div></dialog>
<script>
const $=s=>document.querySelector(s),K="eybelis-check-v1";let R=JSON.parse(localStorage.getItem(K)||"{}"),V=new Date(),C=null;V.setDate(1);const p=n=>String(n).padStart(2,"0"),key=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,same=(a,b)=>a.toDateString()==b.toDateString();
function render(){let y=V.getFullYear(),m=V.getMonth(),g=$("#grid"),t=new Date();$("#month").textContent=`${y}년 ${m+1}월`;g.innerHTML="";for(let i=0;i<new Date(y,m,1).getDay();i++)g.insertAdjacentHTML("beforeend",'<div class="day empty"></div>');for(let n=1;n<=new Date(y,m+1,0).getDate();n++){let d=new Date(y,m,n),k=key(d),b=document.createElement("button");b.className="day"+(same(d,t)?" today":"");b.innerHTML=`<div class="num">${n}</div>${R[k]?`<div class="mark"><span class="dot"></span>${R[k]}</div>`:""}`;b.onclick=()=>{C=d;$("#sel").textContent=`${m+1}월 ${n}일`;$("#dlg").showModal()};g.appendChild(b)}}
$("#no").onclick=()=>$("#dlg").close();$("#yes").onclick=()=>{let n=new Date(),h=n.getHours(),ap=h<12?"오전":"오후";h=h%12||12;R[key(C)]=`${ap} ${h}:${p(n.getMinutes())}`;localStorage.setItem(K,JSON.stringify(R));$("#dlg").close();render()};$("#prev").onclick=()=>{V.setMonth(V.getMonth()-1);render()};$("#next").onclick=()=>{V.setMonth(V.getMonth()+1);render()};render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
