<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3157d6"><link rel="manifest" href="manifest.webmanifest">
<title>자기 전 안약 체크</title>
<style>
:root{--blue:#3158e8;--ink:#11173d;--lav:#e3ddff;--line:#dedff0}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}
body{
 background:linear-gradient(#72b8ff 0 58%,#7bc45d 58% 100%);
 background-attachment:fixed; padding:3.8vw 0 0;
}
body:after{content:"";position:fixed;z-index:-1;left:0;right:0;bottom:0;height:28vh;background:url("meadow.png") bottom center/cover no-repeat}
.app{width:min(92vw,790px);margin:0 auto 24px;border:2px solid #3155bb;background:#fff;box-shadow:0 10px 25px #22468d38}
.approvedHeader{width:100%;display:block;height:auto}
.panel{
 margin:-1px 10px 10px;border:2px solid #a6a8e5;border-radius:28px;
 background:linear-gradient(#fff,#fdfcff);padding:26px 12px 18px;box-shadow:inset 0 0 0 2px #f3efff
}
.head{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px;margin:0 12px 18px}
.month{text-align:center;font-size:clamp(25px,5vw,38px);font-weight:900;letter-spacing:-1px}
.nav{height:58px;border:2px solid #c7bff2;border-radius:9px;background:linear-gradient(#faf7ff,#e3ddff);font-size:38px;color:#101638;box-shadow:inset -2px -2px 0 #bcb5d9}
.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.week div{text-align:center;font-weight:800;color:#4c527a;padding:5px 0 10px}.week div:first-child{color:#f05b7d}.week div:last-child{color:#3159eb}
.day{
 position:relative;min-height:128px;border:1.5px solid var(--line);border-radius:14px;
 background:linear-gradient(145deg,#fcfcff,#f7f7fd);display:flex;align-items:center;justify-content:center;
 overflow:hidden;color:var(--ink);padding:0
}
.empty{visibility:hidden}.today{border:2.5px solid var(--blue);background:#fff}
.doneCircle{position:absolute;width:min(92%,100px);aspect-ratio:1;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 35%,#f0ecff,#ddd6ff 75%,#d2caff)}
.content{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:100%;height:100%}
.num{font-size:21px;font-weight:900;line-height:1}.mark{font-size:15px;font-weight:800;color:#5965a0;line-height:1;font-variant-numeric:tabular-nums}
.miniBottle{position:absolute;z-index:3;left:7px;top:8px;width:30px;height:38px;object-fit:contain}
.missed{background:#fff7f9}.missMark{font-size:34px;color:#d82e4a;font-weight:900;line-height:1}
.legend{margin-top:18px;padding:14px 10px;border:1.5px solid #ddd8ef;border-radius:10px;background:#f8f5ff;display:flex;justify-content:space-around;gap:6px;font-size:12px;font-weight:800;color:#454a73}
.legend span{display:flex;align-items:center;gap:6px}.lg{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center}.lgd{background:#dfd8ff}.lgx{background:#ffc3cf;color:#c9233d;font-size:23px}.lgt{border:2px solid var(--blue);background:#fff}.lgn{border:2px solid #d7d9e7;background:#fff}
.hint{text-align:center;color:#8b8fa8;font-size:12px;margin-top:12px}
dialog{border:2px solid #3155bb;padding:0;width:min(88vw,370px);box-shadow:8px 8px 0 #18327745}dialog::backdrop{background:#1c275c66}
.modalTitle{background:#3157d6;color:#fff;font-weight:800;padding:9px 12px}.modalBody{padding:20px;text-align:center}.modalBody h2{margin:0 0 5px}.modalBody p{color:#686e91}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:2px outset #eeeaff;padding:12px;font-weight:800;background:#eeeef7}.yes{background:#ddd8ff}
.timeBox{display:none;margin-top:13px;text-align:left}.timeBox label{display:block;font-size:12px;color:#666d90;margin-bottom:6px}.timeBox input{width:100%;padding:11px;font:inherit}.small{font-size:10px;color:#969bb1;margin-top:6px}
@media(max-width:500px){
 body{padding-top:2vw}.app{width:96vw}.panel{margin-left:7px;margin-right:7px;padding:18px 8px 14px;border-radius:20px}
 .head{grid-template-columns:52px 1fr 52px;margin:0 8px 13px}.nav{height:50px;font-size:31px}
 .week,.grid{gap:5px}.day{min-height:108px}.num{font-size:18px}.mark{font-size:13px}.miniBottle{width:25px;height:32px;left:5px;top:6px}
 .legend{font-size:10px;padding:11px 5px}.lg{width:25px;height:25px}
}
</style></head>
<body><main class="app">
<img class="approvedHeader" src="header.png" alt="자기 전 안약 체크">
<section class="panel">
<div class="head"><button class="nav" id="prev">‹</button><div class="month" id="month"></div><button class="nav" id="next">›</button></div>
<div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
<div class="grid" id="grid"></div>
<div class="legend"><span><i class="lg lgd"></i>복용 완료</span><span><i class="lg lgx">×</i>미복용</span><span><i class="lg lgt"></i>오늘</span><span><i class="lg lgn"></i>기록 없음</span></div>
<div class="hint">날짜를 눌러 점안 여부를 기록하거나 수정하세요.</div>
</section></main>
<dialog id="dlg"><div class="modalTitle">안약 체크</div><div class="modalBody"><h2 id="q">안약 넣었나요?</h2><p id="sel"></p>
<div class="timeBox" id="timeBox"><label>점안 시간을 직접 입력하세요.</label><input type="time" id="timeInput"><div class="small">과거 기록과 자동 X도 나중에 수정할 수 있어요.</div></div>
<div class="actions" id="actions"></div></div></dialog>
<script>
const $=s=>document.querySelector(s),K="eybelis-check-v2",OLD="eybelis-check-v1";let R=JSON.parse(localStorage.getItem(K)||"null");
if(!R){const o=JSON.parse(localStorage.getItem(OLD)||"{}");R={};for(const[k,v]of Object.entries(o))R[k]={status:"done",time:v};localStorage.setItem(K,JSON.stringify(R))}
let V=new Date(),C=null;V.setDate(1);const p=n=>String(n).padStart(2,"0"),key=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,same=(a,b)=>a.toDateString()===b.toDateString();
function save(){localStorage.setItem(K,JSON.stringify(R))}
for(const k of Object.keys(R))if(k<"2026-10-14"&&R[k]?.status==="missed")delete R[k];save();
function cutoffPassed(d){const end=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return Date.now()-end.getTime()>=12*60*60*1000}
function applyMissed(){const start=new Date(2026,9,14),today=new Date();today.setHours(0,0,0,0);for(let d=new Date(start);d<today;d.setDate(d.getDate()+1)){const k=key(d);if(!R[k]&&cutoffPassed(d))R[k]={status:"missed"}}save()}
function to24(v){if(!v)return"";if(/^\d{1,2}:\d{2}$/.test(v)){let[h,m]=v.split(":");return`${p(Number(h))}:${m}`}const m=v.match(/(오전|오후)\s*(\d{1,2}):(\d{2})/);if(!m)return"";let h=+m[2];if(m[1]==="오전"&&h===12)h=0;if(m[1]==="오후"&&h!==12)h+=12;return`${p(h)}:${m[3]}`}
function grace(d){const n=new Date();if(n.getHours()>=5)return false;const y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1),t=new Date(d);y.setHours(0,0,0,0);t.setHours(0,0,0,0);return same(y,t)}
function render(){applyMissed();const y=V.getFullYear(),m=V.getMonth(),g=$("#grid"),now=new Date();$("#month").textContent=`${y}년 ${m+1}월`;g.innerHTML="";
for(let i=0;i<new Date(y,m,1).getDay();i++)g.insertAdjacentHTML("beforeend",'<div class="day empty"></div>');
for(let n=1;n<=new Date(y,m+1,0).getDate();n++){const d=new Date(y,m,n),k=key(d),r=R[k],b=document.createElement("button");b.className="day"+(same(d,now)?" today":"")+(r?.status==="missed"?" missed":"");
let h=`<div class="content"><div class="num">${n}</div>`;if(r?.status==="done")h+=`<div class="mark">${to24(r.time)}</div>`;else if(r?.status==="missed")h+=`<div class="missMark">×</div>`;h+="</div>";
if(r?.status==="done")h=`<div class="doneCircle"></div><img class="miniBottle" src="bottle-mini.png" alt="">`+h;b.innerHTML=h;b.onclick=()=>openDay(d);g.appendChild(b)}}
function setDone(k,t){R[k]={status:"done",time:t};save();$("#dlg").close();render()}
function openDay(d){C=new Date(d);const k=key(C),r=R[k],n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate()),t=new Date(C);t.setHours(0,0,0,0);const past=t<today,ok=grace(t);
$("#sel").textContent=`${C.getMonth()+1}월 ${C.getDate()}일`;$("#timeBox").style.display="none";$("#actions").innerHTML="";
if((!past||ok)&&!r){$("#q").textContent="안약 넣었나요?";$("#actions").innerHTML='<button class="btn" id="no">아니요</button><button class="btn yes" id="yes">예</button>';$("#no").onclick=()=>$("#dlg").close();$("#yes").onclick=()=>{const x=new Date();setDone(k,`${p(x.getHours())}:${p(x.getMinutes())}`)}}
else{$("#q").textContent=r?.status==="done"?"점안 기록을 수정할까요?":r?.status==="missed"?"미복용 기록을 수정할까요?":"과거 점안 기록을 입력할까요?";$("#timeBox").style.display="block";$("#timeInput").value=to24(r?.time)||"22:30";$("#actions").innerHTML='<button class="btn" id="cancel">취소</button><button class="btn yes" id="edit">복용 완료</button>';$("#cancel").onclick=()=>$("#dlg").close();$("#edit").onclick=()=>setDone(k,$("#timeInput").value)}
$("#dlg").showModal()}
$("#prev").onclick=()=>{V.setMonth(V.getMonth()-1);render()};$("#next").onclick=()=>{V.setMonth(V.getMonth()+1);render()};render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update());
</script></body></html>
